name: Site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Interaction regression tests
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify public content and language links
        run: node tools/verify-public-build.mjs
